# Nixpacks build config for Railway.
#
# CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER overrides the /tmp/zig-cc entry
# in .cargo/config.toml (which is only valid locally). gcc is installed via nix
# so `cc` is available as the real linker on Railway.
#
# The explicit setup phase also prevents Nixpacks from auto-injecting
# `rustup target add` steps based on .cargo/config.toml target sections.

[variables]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "cc"

[phases.setup]
nixPkgs = ["rustup", "gcc", "nodejs_20"]
cmds = ["rustup default stable"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "cargo build --release",
  "(cd web && npm ci && npm run build)",
]

[start]
cmd = "node server.js"
