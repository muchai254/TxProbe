# Nixpacks build config for Railway.
# Nixpacks installs Rust via nix (not rustup), so rustup is not available.
# Native cargo build is correct here — Railway builds and runs in the same
# container, so glibc compatibility is guaranteed without needing musl.

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "cargo build --release",
  "(cd web && npm ci && npm run build)",
]

[start]
cmd = "node server.js"
