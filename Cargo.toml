[package]
name = "txprobe-analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "txprobe_analyzer"
path = "src/lib.rs"

[[bin]]
name = "txprobe-analyzer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10.9"
bs58 = "0.5"

[lints.clippy]
all = { level = "warn", priority = -1 }
