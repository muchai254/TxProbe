# On every push to main: run all test suites, then deploy to Heroku.
# Heroku builds the Dockerfile (heroku.yml) from the pushed commit.
# Requires the HEROKU_API_KEY repository secret.

name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Server tests
        run: npm ci && npm test
      - name: Frontend tests, lint and build
        working-directory: web
        run: npm ci && npm test && npm run lint && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Heroku rejects pushes from a shallow clone.
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/txprobe.git" HEAD:main
